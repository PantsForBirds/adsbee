# Example adsbee-hil bench file. Copy to ~/.config/adsbee-hil/bench.toml and fill in what
# `adsbee-hil discover` prints.

[bench]
name = "example-bench"
# Per-device lock files. Must be shared by every user and runner on this bench.
lock_dir = "/tmp/adsbee-hil-locks"
# `flash` refuses while a process's command line matches one of these regexes (here: a GitHub
# Actions job). `--force` overrides.
busy_processes = ["bin/Runner.Worker"]

# External tools that aren't part of this repository.
[flashers.adsbee_1421]
# CC13x4 ROM bootloader flasher for the 1421 module (or $ADSBEE_HIL_FLASHER_ADSBEE_1421, shell-quoted).
# Placeholders: {image} {port} {baud} {verbose}. It MUST erase only the image's sectors: a full erase
# wipes the module's settings and OTA keys.
command = ["/path/to/venv/bin/python", "/path/to/cc13x4_flasher.py", "{image}",
           "-p", "{port}", "-b", "{baud}", "--erase", "sector", "{verbose}"]

[[receivers]]
id = "1090u-a"
model = "adsbee_1090u"
usb_serial = "E000000000000001"   # RP2040 USB serial (app mode)
usb_port = "1-1.3"                # optional; checked when set, used to find the BOOTSEL drive
tags = ["ci"]
# host = "adsbee-1090u-a.local"   # for OTA (flash some.ota)

[[receivers]]
id = "1421-a"
model = "adsbee_1421"
usb_serial = "E000000000000002"   # the ADSBee 1421 Programmer's USB serial
usb_port = "1-1.4"

