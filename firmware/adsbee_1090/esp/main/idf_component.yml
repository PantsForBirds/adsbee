## IDF Component Manager Manifest File
# Exact versions only. dependencies.lock records the resolved versions and hashes and CI fails if a
# build changes it. To update a pin, see "ESP-IDF and component versions" in firmware/README.md.
dependencies:
  espressif/mdns: "==1.4.3"
  ## Required IDF version. The exact IDF build is pinned by the esp-idf image in ../compose.yml.
  idf:
    version: ">=5.4"
