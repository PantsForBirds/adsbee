services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: swarm
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm"]
      interval: 5s
      retries: 20

  app:
    build: {context: .., dockerfile: docker/Dockerfile}
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: swarm
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${SWARM_DOMAIN}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${SWARM_DOMAIN}
      ADSBEE_SWARM_CLIENT_IP_HEADER: X-Forwarded-For
      ADSBEE_SWARM_TOKEN_KEY: ${ADSBEE_SWARM_TOKEN_KEY:-}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      SWARM_DOMAIN: ${SWARM_DOMAIN:?set SWARM_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  db:
  caddy_data:
