[project]
name = "adsbee-swarm"
version = "0.1.0"
description = "Swarm server for ADSBee receivers: device reports, range maps, firmware rollouts. A reusable Django app."
authors = [{ name = "John McNelly", email = "jkailimcnelly@gmail.com" }]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["django>=4.2,<6", "cryptography>=42"]

[project.optional-dependencies]
server = ["gunicorn>=23.0", "psycopg[binary]>=3.2"]

[tool.poetry]
packages = [{ include = "adsbee_swarm" }]
include = ["adsbee_swarm/templates/**/*", "adsbee_swarm/static/**/*", "adsbee_swarm/openapi.yaml"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-django = "^4.9"
pyyaml = "^6.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
