<span class="windows">{% if tabs|length > 1 %}<span class="protocols">{% for t in tabs %}<a href="?w={{ window }}&amp;p={{ t.key }}" class="{% if t.key == protocol %}on{% endif %}" title="{{ t.title }}">{{ t.symbol }}{% if t.listened %}<small class="dim"> {{ t.heard }}/{{ t.listened }}</small>{% endif %}</a>{% endfor %}</span>{% endif %}<span title="Time window">{% for key in windows %}<a href="?w={{ key }}{% if protocol and protocol != 'aircraft' %}&amp;p={{ protocol }}{% endif %}" class="{% if key == window %}on{% endif %}">{{ key }}</a>{% endfor %}</span></span>
