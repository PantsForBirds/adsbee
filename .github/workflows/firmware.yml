name: ADSBee Firmware CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Detect which product's files changed so each application is only rebuilt when its own
  # files, the shared firmware code (common/ and modules/), or this workflow change.
  # Jobs gated on these outputs are SKIPPED (not absent) when nothing relevant changed, so
  # they still emit check runs and skipped required status checks count as passing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      adsbee_1090: ${{ steps.filter.outputs.adsbee_1090 }}
      adsbee_1421: ${{ steps.filter.outputs.adsbee_1421 }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          adsbee_1090:
            - 'firmware/adsbee_1090/**'
            - 'firmware/common/**'
            - 'firmware/modules/**'
            - 'ci/**'
            - '.github/workflows/firmware.yml'
          adsbee_1421:
            - 'firmware/adsbee_1421/**'
            - 'firmware/common/**'
            - 'firmware/modules/**'
            - '.github/workflows/firmware.yml'

  host_build_and_test:
    runs-on: ubuntu-latest
    container: coolnamesalltaken/pico-docker
    needs: changes
    if: needs.changes.outputs.adsbee_1090 == 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Build googletest submodule
      working-directory: firmware/modules/googletest
      run: mkdir build && cd build && cmake -DBUILD_SHARED_LIBS=ON .. && make
    - name: Create build directory
      working-directory: firmware/adsbee_1090/pico
      run: mkdir -p build
    - name: Run cmake with build type "Test"
      working-directory: firmware/adsbee_1090/pico/build
      run: cmake -DCMAKE_BUILD_TYPE=Test -DCMAKE_C_COMPILER=/usr/bin/gcc -DCMAKE_CXX_COMPILER=/usr/bin/g++ ..
    - name: Build
      working-directory: firmware/adsbee_1090/pico/build
      run: make
    - name: Run unit tests
      working-directory: firmware/adsbee_1090/pico/build
      run: ctest --verbose

  esp_target_build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.adsbee_1090 == 'true'

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Build ESP32 firmware
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: release-v5.4
        target: esp32s3
        path: firmware/adsbee_1090/esp
    - name: Upload ESP32 firmware
      uses: actions/upload-artifact@v4
      with:
        name: adsbee_esp.bin
        path: firmware/adsbee_1090/esp/build/adsbee_esp.bin
        retention-days: 1
    - name: Upload ESP32 bootloader
      uses: actions/upload-artifact@v4
      with:
        name: bootloader.bin
        path: firmware/adsbee_1090/esp/build/bootloader/bootloader.bin
        retention-days: 1
    - name: Upload ESP32 partition table
      uses: actions/upload-artifact@v4
      with:
        name: partition-table.bin
        path: firmware/adsbee_1090/esp/build/partition_table/partition-table.bin
        retention-days: 1

  ti_target_build:
    runs-on: ubuntu-latest
    container: coolnamesalltaken/ti-lpf2
    needs: changes
    if: needs.changes.outputs.adsbee_1090 == 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Create TI build directory
      working-directory: firmware/adsbee_1090/ti/sub_ghz_radio
      run: mkdir -p build
    - name: Run cmake with build type "Release"
      working-directory: firmware/adsbee_1090/ti/sub_ghz_radio/build
      run: cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/usr/bin/arm-none-eabi-gcc -DCMAKE_CXX_COMPILER=/usr/bin/arm-none-eabi-g++ ..
    - name: Build
      working-directory: firmware/adsbee_1090/ti/sub_ghz_radio/build
      run: cmake --build . --config Release --target all -j 22
    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sub_ghz_radio.bin
        path: firmware/adsbee_1090/ti/sub_ghz_radio/build/sub_ghz_radio.bin
        retention-days: 1

  pico_target_build:
    runs-on: ubuntu-latest
    container: coolnamesalltaken/pico-docker
    needs:
      - changes
      - esp_target_build
      - ti_target_build
    if: needs.changes.outputs.adsbee_1090 == 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Create ESP32 build directory
      working-directory: firmware/adsbee_1090/esp
      run: mkdir -p build
    - name: Download ESP32 firmware
      uses: actions/download-artifact@v4
      with:
        name: adsbee_esp.bin
        path: firmware/adsbee_1090/esp/build/Release
    - name: Download ESP32 bootloader
      uses: actions/download-artifact@v4
      with:
        name: bootloader.bin
        path: firmware/adsbee_1090/esp/build/Release/bootloader
    - name: Download ESP32 partition table
      uses: actions/download-artifact@v4
      with:
        name: partition-table.bin
        path: firmware/adsbee_1090/esp/build/Release/partition_table
    - name: Download TI firmware
      uses: actions/download-artifact@v4
      with:
        name: sub_ghz_radio.bin
        path: firmware/adsbee_1090/ti/sub_ghz_radio/build
    - name: Create Pico build directory
      working-directory: firmware/adsbee_1090/pico
      run: mkdir -p build
    - name: Run cmake with build type "Release"
      working-directory: firmware/adsbee_1090/pico/build
      run: cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/usr/bin/arm-none-eabi-gcc -DCMAKE_CXX_COMPILER=/usr/bin/arm-none-eabi-g++ ..
    - name: Build
      working-directory: firmware/adsbee_1090/pico/build
      run: cmake --build . --config Release --target all -j 22
    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: |
          firmware/adsbee_1090/pico/build/application/combined.uf2
          firmware/adsbee_1090/pico/build/application/adsbee_1090.ota

  hardware_test:
    runs-on: [self-hosted, adsbee-hardware]
    needs: pico_target_build
    # Run only on pushes to main — not on PRs — so hardware failures block
    # merges without gating every PR on physical hardware availability.
    # When adsbee_1090 did not change, pico_target_build is skipped and this job
    # skips with it (skipped required checks count as passing).
    #
    # This job is opt-in and non-blocking.
    #  * The vars.HIL_ENABLED gate skips the job entirely unless the repository
    #    variable HIL_ENABLED is set to 'true' (Settings → Secrets and variables →
    #    Actions → Variables). Skipping matters more than continue-on-error here:
    #    when the self-hosted runner is offline the job would otherwise sit queued
    #    for hours and leave a required check pending forever.
    #  * continue-on-error keeps a genuine test failure from failing the workflow
    #    run once the job is re-enabled but the fixture is still flaky.
    # To restore blocking behavior: set HIL_ENABLED=true, then delete the
    # continue-on-error line and the vars.HIL_ENABLED clause below.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.HIL_ENABLED == 'true'
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download firmware artifacts
      uses: actions/download-artifact@v4
      with:
        name: firmware
        path: firmware/adsbee_1090/pico/build/application

    - name: Install Python dependencies
      run: |
        python3 -m venv .venv
        .venv/bin/pip install -r ci/test_usb_and_ota_flash/requirements.txt

    - name: Run hardware test
      run: |
        # Derive the expected firmware version from source so the post-OTA
        # health check can confirm the RP2040 actually reports it (see
        # check_firmware_version in ci/test_usb_and_ota_flash/check_device.py).
        dict=firmware/common/coprocessor/object_dictionary.cpp
        maj=$(grep -oP 'kFirmwareVersionMajor\s*=\s*\K[0-9]+' "$dict")
        min=$(grep -oP 'kFirmwareVersionMinor\s*=\s*\K[0-9]+' "$dict")
        pat=$(grep -oP 'kFirmwareVersionPatch\s*=\s*\K[0-9]+' "$dict")
        rc=$(grep -oP 'kFirmwareVersionReleaseCandidate\s*=\s*\K[0-9]+' "$dict")
        if [ "$rc" -eq 0 ]; then ver="$maj.$min.$pat"; else ver="$maj.$min.$pat-rc$rc"; fi
        echo "Expecting RP2040 firmware version: $ver"
        .venv/bin/python3 ci/test_usb_and_ota_flash/test_ota.py \
          -p /dev/ttyACM0 \
          --uf2 firmware/adsbee_1090/pico/build/application/combined.uf2 \
          --ota-fw firmware/adsbee_1090/pico/build/application/adsbee_1090.ota \
          --expected-version "$ver"

  adsbee_1421_build:
    runs-on: ubuntu-latest
    container: coolnamesalltaken/ti-lpf2
    needs: changes
    if: needs.changes.outputs.adsbee_1421 == 'true'
    outputs:
      version: ${{ steps.fwver.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # cppAT (firmware/modules/cppAT) is compiled into the adsbee_1421 comms library.
        submodules: 'recursive'
    - name: Create build directory
      working-directory: firmware/adsbee_1421/ti
      run: mkdir -p build/Release
    - name: Run cmake with build type "Release"
      working-directory: firmware/adsbee_1421/ti/build/Release
      # The ADSBEE_COMMON_DIR / ADSBEE_MODULES_DIR defaults resolve to firmware/common and
      # firmware/modules within this checkout, so no overrides are needed.
      run: cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/usr/bin/arm-none-eabi-gcc -DCMAKE_CXX_COMPILER=/usr/bin/arm-none-eabi-g++ ../..
    - name: Build
      working-directory: firmware/adsbee_1421/ti/build/Release
      run: cmake --build . --config Release --target all -j 22
    - name: Extract firmware version
      id: fwver
      working-directory: firmware/adsbee_1421/ti
      run: |
        dict=object_dictionary/object_dictionary.cpp
        maj=$(grep -oP 'kFirmwareVersionMajor\s*=\s*\K[0-9]+' "$dict")
        min=$(grep -oP 'kFirmwareVersionMinor\s*=\s*\K[0-9]+' "$dict")
        pat=$(grep -oP 'kFirmwareVersionPatch\s*=\s*\K[0-9]+' "$dict")
        rc=$(grep -oP 'kFirmwareVersionReleaseCandidate\s*=\s*\K[0-9]+' "$dict")
        if [ "$rc" -eq 0 ]; then ver="$maj.$min.$pat"; else ver="$maj.$min.$pat-rc$rc"; fi
        echo "Firmware version: $ver"
        echo "version=$ver" >> "$GITHUB_OUTPUT"
    - name: Upload CC1314 firmware hex
      uses: actions/upload-artifact@v4
      with:
        name: adsbee_1421-${{ steps.fwver.outputs.version }}.hex
        path: firmware/adsbee_1421/ti/build/Release/adsbee_1421-${{ steps.fwver.outputs.version }}.hex
        retention-days: 1
    - name: Upload CC1314 firmware elf
      uses: actions/upload-artifact@v4
      with:
        name: adsbee_1421-${{ steps.fwver.outputs.version }}.elf
        path: firmware/adsbee_1421/ti/build/Release/adsbee_1421-${{ steps.fwver.outputs.version }}.elf
        retention-days: 1

  adsbee_1421_programmer_build:
    runs-on: ubuntu-latest
    container: coolnamesalltaken/pico-docker
    needs:
      - changes
      - adsbee_1421_build
    # The programmer bakes the adsbee_1421 hex into its image, so it rebuilds on any
    # adsbee_1421-relevant change, always against the freshly built hex from adsbee_1421_build.
    if: needs.changes.outputs.adsbee_1421 == 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Download CC1314 firmware hex
      uses: actions/download-artifact@v4
      with:
        name: adsbee_1421-${{ needs.adsbee_1421_build.outputs.version }}.hex
        path: firmware/adsbee_1421/ti/build/Release
    - name: Create build directory
      working-directory: firmware/adsbee_1421/programmer
      run: mkdir -p build/Release
    - name: Run cmake with build type "Release"
      working-directory: firmware/adsbee_1421/programmer/build/Release
      # picotool is not in the image; the Pico SDK builds it from source into the given cache dir.
      run: cmake -DCMAKE_BUILD_TYPE=Release -DPICOTOOL_FETCH_FROM_GIT_PATH=$GITHUB_WORKSPACE/.picotool -DADSBEE_1421_HEX=$GITHUB_WORKSPACE/firmware/adsbee_1421/ti/build/Release/adsbee_1421-${{ needs.adsbee_1421_build.outputs.version }}.hex ../..
    - name: Build
      working-directory: firmware/adsbee_1421/programmer/build/Release
      run: cmake --build . --config Release --target all -j 22
    - name: Upload programmer uf2
      uses: actions/upload-artifact@v4
      with:
        name: adsbee_1421_programmer-fw${{ needs.adsbee_1421_build.outputs.version }}.uf2
        path: firmware/adsbee_1421/programmer/build/Release/adsbee_1421_programmer.uf2
        retention-days: 1
    - name: Upload programmer elf
      uses: actions/upload-artifact@v4
      with:
        name: adsbee_1421_programmer-fw${{ needs.adsbee_1421_build.outputs.version }}.elf
        path: firmware/adsbee_1421/programmer/build/Release/adsbee_1421_programmer.elf
        retention-days: 1

