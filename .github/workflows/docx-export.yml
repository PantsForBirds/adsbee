# Exports word/*.docx to word/exports/<name>.pdf with LibreOffice, set up to match Word's layout (microslop).
#   pull_request -> docx changed in the PR whose PDF is older than the docx; PDFs are committed to the
#                   PR branch (artifact only for forks)
#   workflow_dispatch -> all docx; committed to the chosen branch (artifact only on the default branch)
# No loop: GITHUB_TOKEN pushes don't start runs (they wait for approval), and a rerun finds the PDFs up to date.
name: docx-export

on:
  pull_request:
    paths:
      - "word/**.docx"
  workflow_dispatch:

concurrency:
  group: docx-export-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PUSH: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch) }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Select docs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags "https://github.com/$BASE_REPO" "$BASE_SHA"
            docs=()
            for doc in $(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- 'word/*.docx'); do
              pdf="word/exports/$(basename "$doc" .docx).pdf"
              # Skip if the PDF was committed with or after the docx (already exported).
              if [ -f "$pdf" ] && git merge-base --is-ancestor \
                  "$(git log -1 --format=%H -- "$doc")" "$(git log -1 --format=%H -- "$pdf")"; then
                echo "Up to date: $pdf"
              else
                docs+=("$doc")
              fi
            done
          else
            docs=(word/*.docx)
          fi
          echo "Exporting: ${docs[*]:-none}"
          echo "docs=${docs[*]}" >> "$GITHUB_OUTPUT"

      # LibreOffice, Word substitute fonts and docx adjustments: https://github.com/CoolNamesAllTaken/microslop
      - uses: pantsforbirds-claud/microslop@1d79d8c921e697a7b323a3d891de957728fb2fef
        if: steps.select.outputs.docs != ''
        with:
          files: ${{ steps.select.outputs.docs }}
          output-dir: word/exports

      - name: Collect PDFs
        if: steps.select.outputs.docs != ''
        env:
          DOCS: ${{ steps.select.outputs.docs }}
        run: |
          mkdir -p "$RUNNER_TEMP/pdfs"
          for doc in $DOCS; do
            cp "word/exports/$(basename "$doc" .docx).pdf" "$RUNNER_TEMP/pdfs/"
          done

      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.docs != ''
        with:
          name: docx-export-pdfs
          path: ${{ runner.temp }}/pdfs

      - name: Commit PDFs
        if: steps.select.outputs.docs != '' && env.PUSH == 'true'
        run: |
          git add word/exports
          if git diff --cached --quiet; then
            echo "No PDF changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "word: export PDFs" -m "$(git diff --cached --name-only)"
          git push origin HEAD:"$BRANCH"
