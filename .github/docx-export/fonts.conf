<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Substitutes for Word fonts missing on Linux ("Docx ..." fonts come from make_fonts.py). Used by docx-export.yml. -->
<fontconfig>
  <alias binding="same">
    <family>Calibri</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="same">
    <family>Calibri Light</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="same">
    <family>Consolas</family>
    <prefer><family>Docx Consolas</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Symbol</family>
    <prefer><family>Docx Segoe Symbol</family></prefer>
  </alias>
  <alias binding="same">
    <family>SimSun</family>
    <prefer><family>Docx SimSun</family></prefer>
  </alias>
  <alias binding="same">
    <family>宋体</family>
    <prefer><family>Docx SimSun</family></prefer>
  </alias>
  <alias binding="same">
    <family>DengXian</family>
    <prefer><family>Docx DengXian</family></prefer>
  </alias>
  <alias binding="same">
    <family>DengXian Light</family>
    <prefer><family>Docx DengXian</family></prefer>
  </alias>
  <alias binding="same">
    <family>等线</family>
    <prefer><family>Docx DengXian</family></prefer>
  </alias>
  <alias binding="same">
    <family>等线 Light</family>
    <prefer><family>Docx DengXian</family></prefer>
  </alias>
  <!-- Word falls back to Segoe UI Symbol for symbols missing in Calibri (check marks) -->
  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="append" binding="strong"><string>Docx Segoe Symbol</string></edit>
  </match>
</fontconfig>
